name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Publishes main by hand, for when a tag can't be pushed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      is-newest: ${{ steps.newest.outputs.is-newest }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      # Pushing several tags at once must not let an older one overwrite the published page.
      - name: Is this the newest version tag
        id: newest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          newest=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          echo "is-newest=$([ "$newest" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: >-
      (startsWith(github.ref, 'refs/tags/v') && needs.check.outputs.is-newest == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: check
    runs-on: ubuntu-latest
    # Deploys queue instead of racing; only the newest tag deploys at all.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
